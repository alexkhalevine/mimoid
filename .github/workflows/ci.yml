name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      # Runs on ubuntu, so this is also the Linux-support regression net:
      # the port-discovery fallback and its `ss` output parser are
      # unix-only code paths that never compile on the macOS release job.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      # Pinned: an unpinned `ruff` install broke CI on an unrelated PR when
      # ruff 0.16.0 turned on new default lint rules (ISC004, SIM117, SIM103,
      # PIE810, BLE001, PLE2502) that flagged pre-existing code across the
      # whole sidecar with zero warning -- pinning makes "ruff enabled a new
      # rule" an explicit version bump instead of a silent, unrelated-looking
      # failure on someone else's PR.
      - run: pip install -r requirements.txt ruff==0.16.0
        working-directory: sidecar
      - run: ruff check .
        working-directory: sidecar
      - run: python -m compileall app
        working-directory: sidecar
      - run: python -m unittest discover -s tests
        working-directory: sidecar
